version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom"
          ]
      tooling:
        patterns:
          ["eslint*", "prettier*", "@trivago/*", "typescript", "@types/node"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
