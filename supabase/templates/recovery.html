<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Restablece tu contraseña de Tesoro</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f5f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f5f5f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background-color: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 12px;
              font-family: Arial, Helvetica, sans-serif;
              color: #171717;
            "
          >
            <tr>
              <td style="padding: 32px 32px 0">
                <p
                  style="
                    margin: 0;
                    font-size: 20px;
                    font-weight: bold;
                    letter-spacing: -0.02em;
                  "
                >
                  Tesoro
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 32px">
                <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3">
                  Restablece tu contraseña
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6">
                  Recibimos una solicitud para cambiar la contraseña de
                  {{.Email}}. Abre el enlace para elegir una nueva.
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                  style="
                    display: inline-block;
                    padding: 12px 20px;
                    background-color: #171717;
                    color: #fafafa;
                    font-size: 15px;
                    font-weight: bold;
                    text-decoration: none;
                    border-radius: 8px;
                  "
                >
                  Elegir nueva contraseña
                </a>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #737373;
                  "
                >
                  El enlace vence en 1 hora y solo se puede usar una vez. Si no
                  pediste este cambio, ignora este correo: tu contraseña sigue
                  igual.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
